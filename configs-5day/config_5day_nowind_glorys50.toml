# 5-day hybrid run, zero winds, GLORYS bathymetry and GLORYS's 50 levels (Nz and depth ignored). Needs fjp/hybrid-obc with step 14.
#   julia +1.13 --project=. panarctic.jl ../panarctic-tools/configs-5day/config_5day_hybrid.toml
# Compare with plotting/obc_comparison.jl (edges), plotting/section_comparison.jl (gateways) and
# plotting/atlantic_edge_section.jl (temperature near the Atlantic edge), passing the output directories.

architecture = "GPU"

[grid]
spacing_km = 15
bathymetry = "glorys"
vertical   = "glorys"
Nz         = 20
depth      = 5000

[time]
start_date = 1993-01-01
dt_minutes = 10
stop_hours = 120

[atmosphere]
jra55 = "multi_year"
winds = false

[paths]
data_dir   = ""
output_dir = "/mnt/autofs/bow.math/scratch/fpoulin/results/PanArcticShenanigans/5day-nowind-glorys50"

[boundaries]
velocity_inflow_days      = 1
tracer_inflow_km_atlantic = 20
tracer_inflow_km_pacific  = 20
sponge = false
barotropic = "hybrid"
total_net_inflow_Sv = "glorys_transport"   # ignored by "flather"
per_edge_target = "native"
volume_nudging_days = 0

[diagnostics]
sections = true
edge_section_rows = 8
