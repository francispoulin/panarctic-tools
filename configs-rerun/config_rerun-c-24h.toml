# Baseline for locating the shelf drain (roadmap part 1, step 1): 24 hours with the hourly free surface (sections = true),
# rerun in the same session after rerun-a-3h. Then: julia --project=. plotting/eta_hourly.jl <this file> window=all
#   In the same REPL:  empty!(ARGS); push!(ARGS, "<this file>"); include("rerun.jl")

architecture = "GPU"

[grid]
spacing_km = 15
Nz         = 20
depth      = 5000

[time]
start_date = 1993-01-01
dt_minutes = 10
stop_hours = 24

[atmosphere]
jra55 = "multi_year"
winds = false

[paths]
data_dir   = ""
output_dir = "/mnt/autofs/bow.math/scratch/fpoulin/results/PanArcticShenanigans/rerun-c-24h"

[boundaries]
velocity_inflow_days      = 1
tracer_inflow_km_atlantic = 20
tracer_inflow_km_pacific  = 20
sponge = false
barotropic = "hybrid"
total_net_inflow_Sv = "glorys_transport"   # ignored by "flather"
per_edge_target = "native"
volume_nudging_days = 0

[diagnostics]
sections = true
edge_section_rows = 8
initial_vorticity = false
tendencies = false

[initialization]
balance = "full"
ocean_only = true
