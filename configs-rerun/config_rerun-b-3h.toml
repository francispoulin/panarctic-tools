# Rerun test, second run: the same 3 hours with include("rerun.jl") in the same session. transport_monitor.csv and the
# progress lines should match rerun-a-3h; the log should show no long first step (no compilation).
#   In the same REPL:  empty!(ARGS); push!(ARGS, "<this file>"); include("rerun.jl")

architecture = "GPU"

[grid]
spacing_km = 15
Nz         = 20
depth      = 5000

[time]
start_date = 1993-01-01
dt_minutes = 10
stop_hours = 3

[atmosphere]
jra55 = "multi_year"
winds = false

[paths]
data_dir   = ""
output_dir = "/mnt/autofs/bow.math/scratch/fpoulin/results/PanArcticShenanigans/rerun-b-3h"

[boundaries]
velocity_inflow_days      = 1
tracer_inflow_km_atlantic = 20
tracer_inflow_km_pacific  = 20
sponge = false
barotropic = "hybrid"
total_net_inflow_Sv = "glorys_transport"   # ignored by "flather"
per_edge_target = "native"
volume_nudging_days = 0

[diagnostics]
sections = false
edge_section_rows = 8
initial_vorticity = false
tendencies = false

[initialization]
balance = "full"
ocean_only = true
