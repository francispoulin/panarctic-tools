# Shelf-drain test: as config_rerun-c-24h.toml (ocean only, hybrid edges, balanced start, no atmosphere, 24 hours,
# hourly free surface), with a horizontal biharmonic viscosity of 9e10 m⁴/s (GLORYS12's 2e10 m⁴/s at 1/12°, scaled
# with Δx³ to 15 km). Builds a new model type, so run it in a fresh REPL. Needs fjp/hybrid-obc with step 37.
#   empty!(ARGS); push!(ARGS, "<this file>"); include("panarctic.jl")
# Then compare with rerun-c-24h: plotting/eta_hourly.jl <config> window=all (in a shell, not in a REPL with a model).

architecture = "GPU"

[grid]
spacing_km = 15
Nz         = 20
depth      = 5000

[time]
start_date = 1993-01-01
dt_minutes = 10
stop_hours = 24

[atmosphere]
jra55 = "multi_year"
winds = false

[paths]
data_dir   = ""
output_dir = "/mnt/autofs/bow.math/scratch/fpoulin/results/PanArcticShenanigans/biharmonic-9e10-24h"

[boundaries]
velocity_inflow_days      = 1
tracer_inflow_km_atlantic = 20
tracer_inflow_km_pacific  = 20
sponge = false
barotropic = "hybrid"
total_net_inflow_Sv = "glorys_transport"   # ignored by "flather"
per_edge_target = "native"
volume_nudging_days = 0

[diagnostics]
sections = true
edge_section_rows = 8
initial_vorticity = false
tendencies = false

[initialization]
balance = "full"
ocean_only = true

[ocean]
horizontal_biharmonic_viscosity = 9e10
